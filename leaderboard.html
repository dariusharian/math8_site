<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیدربورد ریاضی هشتم</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <header>
        <h1>🏆 لیدربورد</h1>
        <p>بهترین امتیازها</p>
    </header>
    <nav>
        <a href="index.html">🏠 خانه</a>
        <a href="quiz.html">📝 آزمون</a>
        <a href="games.html">🎮 بازی‌ها</a>
        <a href="leaderboard.html" class="active">🏆 لیدربورد</a>
    </nav>

    <main>
        <div class="quiz-container">
            <h2>🥇 ۲۰ نفر برتر</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>رتبه</th>
                        <th>نام</th>
                        <th>امتیاز</th>
                        <th>تاریخ</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
            <div style="text-align:center;margin-top:20px">
                <button onclick="clearLeaderboard()" style="padding:12px 25px;background:#e74c3c;color:white;border:none;border-radius:10px;cursor:pointer;font-weight:600">🗑️ پاک کردن لیدربورد</button>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script>
        function renderLeaderboard() {
            const lb = Storage.getLeaderboard();
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';
            
            if (lb.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding:30px;text-align:center">هنوز هیچ امتیازی ثبت نشده. اولین نفر باش! 🚀</td></tr>';
                return;
            }
            
            lb.forEach((entry, i) => {
                const tr = document.createElement('tr');
                const date = new Date(entry.date).toLocaleDateString('fa-IR');
                const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
                tr.innerHTML = 
                    <td class="${rankClass}">${medal}</td>
                    <td>${entry.name}</td>
                    <td><strong>${entry.score}</strong></td>
                    <td>${date}</td>
                ;
                tbody.appendChild(tr);
            });
        }
        
        function clearLeaderboard() {
            if (confirm('آیا مطمئنی می‌خوای کل لیدربورد رو پاک کنی؟')) {
                localStorage.removeItem('math8_leaderboard');
                renderLeaderboard();
            }
        }
        
        renderLeaderboard();
    </script>
</body>
</html>
